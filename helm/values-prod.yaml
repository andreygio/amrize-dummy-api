env:
  ENVIRONMENT: prod

image:
  tag: "1.0.0"

replicaCount: 3

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

ingress:
  hosts:
    - host: hello-platform.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: hello-platform-prod-tls
      hosts:
        - hello-platform.example.com
