replicaCount: 2
image:
  repository: ghcr.io/andreygio/hello-platform
  pullPolicy: IfNotPresent
  tag: "latest"
imagePullSecrets: []
service:
  type: ClusterIP
  port: 80
  targetPort: 8080
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: hello-platform.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: hello-platform-tls
      hosts:
        - hello-platform.example.com
env:
  APPLICATION_NAME: hello-platform
  ENVIRONMENT: dev
  VERSION: 1.0.0
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 10
readinessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 10
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 999
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
nodeSelector: {}
tolerations: []
affinity: {}
