name: build

on:
  push:
    branches: [main]

# One build at a time on main — cancel any in-flight run for the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/hello-platform

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. BUILD & PUSH
  # ─────────────────────────────────────────────────────────────
  build-push:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      packages: write   # push to GHCR

    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────
  # 2. UPDATE HELM VALUES  (GitOps handoff to ArgoCD)
  #    Writes the new image tag into helm/values.yaml and commits
  #    it back to main. ArgoCD detects the change and syncs.
  #    Commits from GITHUB_TOKEN do not re-trigger workflows.
  # ─────────────────────────────────────────────────────────────
  update-helm:
    name: Update Helm Image Tag
    runs-on: ubuntu-latest
    needs: build-push
    permissions:
      contents: write   # push helm values commit back to main

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install yq
        run: |
          curl -sSLo yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          chmod +x yq && sudo mv yq /usr/local/bin/

      - name: Update image.repository and image.tag in values.yaml
        run: |
          yq e '.image.repository = "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"' -i helm/values.yaml
          yq e '.image.tag = "${{ needs.build-push.outputs.image-tag }}"' -i helm/values.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/values.yaml
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update image tag to ${{ needs.build-push.outputs.image-tag }}"
          git push
