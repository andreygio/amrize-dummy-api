name: code-review

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

# Cancel in-flight runs for the same PR on new pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  IMAGE_NAME: hello-platform
  HELM_CHART_DIR: helm

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. SECRET DETECTION
  #    Runs first — fail fast if credentials are in the diff.
  # ─────────────────────────────────────────────────────────────
  secret-detection:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history needed for gitleaks

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────────────────────
  # 2. LINT & FORMAT
  # ─────────────────────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: black — formatting
        run: black --check app/ tests/

      - name: isort — import order
        run: isort --check-only app/ tests/

      - name: flake8 — style & bug patterns
        run: flake8 app/ tests/

  # ─────────────────────────────────────────────────────────────
  # 3. TYPE CHECKING
  # ─────────────────────────────────────────────────────────────
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: mypy — static type analysis
        run: mypy app/

  # ─────────────────────────────────────────────────────────────
  # 4. STATIC SECURITY ANALYSIS
  # ─────────────────────────────────────────────────────────────
  static-analysis:
    name: Static Security Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install tools
        run: pip install -r requirements-dev.txt

      - name: bandit — source code security scan
        run: bandit -c pyproject.toml -r app/ --format sarif -o bandit-results.sarif
        continue-on-error: true  # exit code 1 = findings found; still upload

      - name: Upload Bandit SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('bandit-results.sarif') != ''
        with:
          sarif_file: bandit-results.sarif
          category: bandit

      - name: pip-audit — dependency vulnerability scan
        run: pip-audit -r requirements.txt --format=cyclonedx-json -o pip-audit-results.json
        continue-on-error: true

      - name: Upload pip-audit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-results
          path: pip-audit-results.json
          retention-days: 30

  # ─────────────────────────────────────────────────────────────
  # 5. UNIT & INTEGRATION TESTS + COVERAGE
  # ─────────────────────────────────────────────────────────────
  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write  # required to post coverage comment on the PR
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: pytest — unit & integration tests
        run: pytest -v
        # Coverage threshold (80%) is enforced by --cov-fail-under in pyproject.toml

      - name: Upload coverage XML
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30

      - name: Post coverage summary to PR
        uses: py-cov-action/python-coverage-comment-action@v3
        if: github.event_name == 'pull_request'
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MINIMUM_GREEN: 80
          MINIMUM_ORANGE: 60

  # ─────────────────────────────────────────────────────────────
  # 6. DOCKER BUILD & IMAGE SCAN
  # ─────────────────────────────────────────────────────────────
  build:
    name: Docker Build & Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Trivy — container vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"         # fail on CRITICAL or HIGH with a fix available
          ignore-unfixed: true   # skip CVEs with no upstream patch yet

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  # ─────────────────────────────────────────────────────────────
  # 7. HELM CHART VALIDATION
  #    Critical for ArgoCD — a broken chart will stall the sync.
  # ─────────────────────────────────────────────────────────────
  helm-validate:
    name: Helm Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Install kubeconform
        run: |
          curl -sSLo kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz
          sudo mv kubeconform /usr/local/bin/

      - name: helm lint — base values
        run: helm lint ${{ env.HELM_CHART_DIR }}

      - name: helm lint — staging values
        run: helm lint ${{ env.HELM_CHART_DIR }} -f ${{ env.HELM_CHART_DIR }}/values.yaml -f ${{ env.HELM_CHART_DIR }}/values-staging.yaml

      - name: helm lint — prod values
        run: helm lint ${{ env.HELM_CHART_DIR }} -f ${{ env.HELM_CHART_DIR }}/values.yaml -f ${{ env.HELM_CHART_DIR }}/values-prod.yaml

      - name: helm template | kubeconform — validate rendered manifests
        run: |
          helm template hello-platform ${{ env.HELM_CHART_DIR }} \
            -f ${{ env.HELM_CHART_DIR }}/values.yaml \
            -f ${{ env.HELM_CHART_DIR }}/values-prod.yaml \
          | kubeconform \
              --strict \
              --ignore-missing-schemas \
              --kubernetes-version 1.28.0 \
              --summary

  # ─────────────────────────────────────────────────────────────
  # GATE — all required jobs must pass before merge is allowed.
  #    Add this job as the required status check in branch protection.
  # ─────────────────────────────────────────────────────────────
  all-checks-pass:
    name: All Checks Pass
    runs-on: ubuntu-latest
    needs:
      - secret-detection
      - lint
      - type-check
      - static-analysis
      - test
      - build
      - helm-validate
    steps:
      - run: echo "All required checks passed."
